{% extends "base.html" %}
{% block title %}Code d'accès{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="intro"><span class="eyebrow">Accès invité</span><h1>Saisis ton code</h1><p>Si ton adresse fait partie des personnes invitées, un code à 6 chiffres vient d'y partir depuis Synunnel. Vérifie aussi tes indésirables.</p></div>
  <div class="card auth-card"><h2>Code à 6 chiffres</h2>
    <form method="post" action="{{ url_for('guest_verify') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label>
      <button class="button" type="submit">Entrer</button>
    </form>
  </div>
</section>
{% endblock %}
