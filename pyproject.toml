[project]
name = "synunnel"
version = "0.2.0a1"
description = "Tunnel personnel avec DNS délégué, HTTPS et WireGuard"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
  "argon2-cffi>=23.1,<26",
  "dnspython>=2.6,<3",
  "requests>=2.31,<3",
  "gunicorn>=22,<24",
  "cryptography>=42,<47",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synunnel*"]

[tool.setuptools.package-data]
synunnel = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
