# Synunnel managed. Les journaux de Caddy et du service Synunnel (adresses IP des requêtes) restent dans le
# journal système, gardé 30 jours comme l'annonce la notice ; ils ne sont pas recopiés dans /var/log/syslog,
# dont la rotation hebdomadaire les garderait au-delà. Posé par scripts/install.sh.
if $programname == 'caddy' or $programname == 'synunnel' then stop
