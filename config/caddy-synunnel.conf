# Drop-in systemd posé par scripts/install.sh : l'API d'administration de Caddy écoute sur un
# socket Unix dans un répertoire que seul Caddy traverse, et le rechargement passe par ce socket.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --address unix//run/caddy/admin.sock --force
